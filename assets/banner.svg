" y="0" fill="#1e293b" stroke="#818cf8" stroke-opacity=".6" stroke-width="1" rx="6"/><text x="154" y="17" fill="#818cf8" class="tag-pill">🎨 Kitty &amp; Sixel</text><rect width="126" height="26" x="272" y="0" fill="#1e293b" stroke="#34d399" stroke-opacity=".6" stroke-width="1" rx="6"/><text x="286" y="17" fill="#34d399" class="tag-pill">🖥️ Rich TUI Apps</text><rect width="116" height="26" x="410" y="0" fill="#1e293b" stroke="#f59e0b" stroke-opacity=".6" stroke-width="1" rx="6"/><text x="424" y="17" fill="#f59e0b" class="tag-pill">🔀 Multiplexers</text></g></g><g transform="translate(680, 42)"><rect width="460" height="270" fill="url(#winGrad)" stroke="#334155" stroke-width="1.5" filter="url(#subtleGlow)" rx="12"/><path fill="#0f172a" d="M 0 12 Q 0 0 12 0 L 448 0 Q 460 0 460 12 L 460 38 L 0 38 Z"/><line x1="0" x2="460" y1="38" y2="38" stroke="#1e293b" stroke-width="1.5"/><circle cx="22" cy="19" r="6" fill="#ef4444"/><circle cx="42" cy="19" r="6" fill="#f59e0b"/><circle cx="62" cy="19" r="6" fill="#10b981"/><text x="230" y="24" fill="#64748b" class="tag-pill" text-anchor="middle">zsh — 100×42 (OpenGL / Metal)</text><g class="code-text" font-size="12.5" transform="translate(24, 68)"><text x="0" y="0" fill="#34d399" font-weight="700">❯</text><text x="18" y="0" fill="#38bdf8">starship</text><text x="82" y="0" fill="#e2e8f0">init zsh | source</text><text x="0" y="26" fill="#818cf8" font-weight="700">~/terminal-dev</text><text x="114" y="26" fill="#94a3b8">on</text><text x="136" y="26" fill="#f43f5e"> main</text><text x="194" y="26" fill="#fbbf24">[⚡ 240 FPS]</text><text x="0" y="52" fill="#34d399" font-weight="700">❯</text><text x="18" y="52" fill="#e2e8f0">bench --renderer=gpu --tui=ratatui</text><text x="0" y="80" fill="#64748b">┌───────────────┬────────────┬────────────┐</text><text x="0" y="100" fill="#64748b">│</text><text x="12" y="100" fill="#e2e8f0">Component</text><text x="120" y="100" fill="#64748b">│</text><text x="130" y="100" fill="#38bdf8">Latency</text><text x="226" y="100" fill="#64748b">│</text><text x="236" y="100" fill="#34d399">Framerate</text><text x="342" y="100" fill="#64748b">│</text><text x="0" y="120" fill="#64748b">├───────────────┼────────────┼────────────┤</text><text x="0" y="140" fill="#64748b">│</text><text x="12" y="140" fill="#cbd5e1">Ghostty / Rust</text><text x="120" y="140" fill="#64748b">│</text><text x="130" y="140" fill="#a7f3d0">1.2ms</text><text x="226" y="140" fill="#64748b">│</text><text x="236" y="140" fill="#6ee7b7">240 Hz Sync</text><text x="342" y="140" fill="#64748b">│</text><text x="0" y="160" fill="#64748b">└───────────────┴────────────┴────────────┘</text><text x="0" y="188" fill="#34d399" font-weight="700">❯</text><text x="18" y="188" fill="#e2e8f0">ready for input</text><rect width="8" height="16" x="135" y="174" fill="#38bdf8" class="cursor-blink"/></g></g></svg>